media:
  - name: docs
    label: Documents
    input: static/docs
    output: /static/docs
    categories: [document,spreadsheet]
content:
  - name: pages
    label: Pages
    type: collection
    path: content
    format: toml-frontmatter
    fields:
      - name: title
        type: string
      - name: body
        type: rich-text